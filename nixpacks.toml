[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]
cmds = ["corepack enable", "corepack prepare pnpm@latest --activate"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm run build"
]